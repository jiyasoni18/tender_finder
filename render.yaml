services:
  - type: web
    name: tenderfinder-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/status
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: IREPS_USER
        sync: false
      - key: IREPS_PASS
        sync: false
      - key: TENDERDETAIL_USER
        sync: false
      - key: TENDERDETAIL_PASS
        sync: false
      - key: ENABLE_IREPS
        value: "true"
      - key: ENABLE_MOCK_SITE
        value: "false"
      - key: MAX_DOWNLOADS
        value: "5"
      - key: LOG_LEVEL
        value: "INFO"
      - key: LARK_MODE
        value: "noop"
      - key: DATABASE_URL
        sync: false
